---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
  - package-ecosystem: gomod
    directory: /deploy
    cooldown:
      default-days: 7
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    schedule:
      interval: daily
  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: daily
